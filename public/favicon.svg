<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E2"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382015"/>
      <stop offset="60%" stop-color="#24130C"/>
      <stop offset="100%" stop-color="#140A06"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#D4AF37" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle / Round Rect -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGradient)" stroke="url(#goldGradient)" stroke-width="2.5"/>

  <!-- Inner subtle decorative border -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="13" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.45"/>

  <!-- Stylized Monogram "SM" -->
  <g filter="url(#goldGlow)">
    <!-- Letter S -->
    <path d="M26.2 24C25.8 21.8 24 20.6 21.6 20.6C18.4 20.6 16.2 22.6 16.2 25.6C16.2 31.6 26.5 30.3 26.5 37.6C26.5 41.3 23.5 43.8 19.5 43.8C15.9 43.8 13.5 41.9 13.2 38.6H16.5C16.8 40.3 17.9 41.3 19.6 41.3C21.8 41.3 23.2 39.9 23.2 37.6C23.2 32 12.9 33 12.9 25.6C12.9 21.8 16.2 18.3 21.5 18.3C25.2 18.3 27.9 20.3 28.2 24H26.2Z" fill="url(#goldGradient)"/>
    
    <!-- Letter M -->
    <path d="M32.5 43.5V20.5H35.8L41.2 35.8H41.5L46.8 20.5H50.2V43.5H47.4V26.8L42.5 41H40.2L35.2 26.8V43.5H32.5Z" fill="url(#goldGradient)"/>
  </g>

  <!-- Small star / sparkle accent in gold -->
  <path d="M48.5 14.5C48.5 16.8 49.7 18 52 18C49.7 18 48.5 19.2 48.5 21.5C48.5 19.2 47.3 18 45 18C47.3 18 48.5 16.8 48.5 14.5Z" fill="#FDF6E2"/>
</svg>
